
name: Tejando Keyboard Music

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validar e compilar teclado Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Localizar projeto Android
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "TejandoKeyboard/settings.gradle.kts" ] || [ -f "TejandoKeyboard/settings.gradle" ]; then
            echo "dir=TejandoKeyboard" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Não encontrei settings.gradle nem settings.gradle.kts."
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validar configuração
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle help --stacktrace

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Executar testes disponíveis
        working-directory: ${{ steps.project.outputs.dir }}
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace

      - name: Executar Android Lint
        working-directory: ${{ steps.project.outputs.dir }}
        continue-on-error: true
        run: gradle lint --stacktrace

      - name: Publicar APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tejando-Keyboard-Music-APK
          path: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tejando-Keyboard-Music-Relatorios
          path: |
            ${{ steps.project.outputs.dir }}/app/build/reports/
            ${{ steps.project.outputs.dir }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
# This is a basic workflow to help you get started with Actions

name: CI

